<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101113"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest?v=019"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css?v=019"><title>The Future Was Small</title></head>
<body><noscript>JavaScript is required to run this camera.</noscript><header><div><h1>The Future Was Small</h1><span class="kicker">SIGNAL ARCHIVE / 0.1.9</span></div></header>
<main><section class="monitor" aria-label="Live view"><div class="viewhead"><span id="sourceLabel">DEMO SIGNAL</span><div class="metrics"><span id="spec">—</span><span id="fps">—</span></div></div><div id="stage"><canvas id="screen" aria-label="Processed video preview"></canvas><div id="recIndicator" hidden>● REC <span id="timer">00:00</span></div></div><div id="status" class="viewfoot" role="status" aria-live="polite">Initializing…</div></section><section class="viewer" aria-label="Input and framing"><div class="transport source-actions"><button id="camera" aria-pressed="false">Camera</button><button id="import" aria-pressed="false">Import</button><button id="flip" disabled>Flip</button><input id="file" type="file" accept="video/*,image/*,.mov,.mp4,.webm,.heic,.heif" hidden></div><div id="playback" hidden><button id="play">Play</button><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Seek"><span id="position">0:00</span></div><label id="wholeRow" class="whole" hidden><input id="whole" type="checkbox"> Convert whole clip <small>from start · max 120 s</small></label><div class="framing"><label class="device-picker"><span>Device</span><select id="device" aria-label="Select device"></select></label><label><span>Aspect</span><select id="aspect"><option value="native">Device native</option><option value="original">Source original</option><option>1:1</option><option>4:3</option><option value="9:16">9:16 Portrait</option><option>16:9</option></select></label></div></section><aside><section id="imageControls" aria-label="Image controls"><div id="basic"></div><div class="quick-actions"><button id="random">Randomize</button><button id="reset">Reset</button></div></section><details id="advanced"><summary>Advanced</summary><div id="extra"></div><div class="twocol"><label>Palette<select id="palette"></select></label><label>Output long edge<select id="size"><option value="480">480 px</option><option value="720" selected>720 px</option><option value="1080">1080 px</option></select></label><label>Scan mode<select id="scanMode"><option value="0">Living scan</option><option value="1">Transmission</option></select></label><label>Recording format<select id="format"><option value="auto">Auto (MP4 first)</option><option value="mp4">MP4 only</option><option value="webm">WebM only</option></select></label><label>Audio<select id="audio"><option value="silent">Silent</option><option value="source">Original / mic</option></select></label></div><div class="transport preset-actions"><button id="savePreset">Save preset</button><button id="loadPreset">Load preset</button><input id="presetFile" type="file" accept=".json,application/json" hidden></div></details></aside></main><footer class="capture-dock" aria-label="Capture"><div class="capture"><button id="photo" aria-label="Take photo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M8 6l2-3h4l2 3"/><circle cx="12" cy="13.5" r="3.5"/></svg><span>Photo</span></button><button id="record" class="record"><span class="dot" aria-hidden="true"></span><span id="recordText">Record</span></button><button id="share" disabled aria-label="Last take"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="m5 17 5-5 3 3 3-4 4 5"/><circle cx="8.5" cy="8.5" r="1.2"/></svg><span>Last take</span></button></div><span id="captureStatus" class="sr-only" role="status" aria-live="polite"></span></footer><dialog id="result" aria-labelledby="takeTitle"><div class="take-head"><h2 id="takeTitle">Last take</h2><button id="closeResult" aria-label="Close last take">Close</button></div><div class="take-media"><video id="resultVideo" controls playsinline preload="metadata" hidden></video><img id="resultImage" alt="Captured image" hidden></div><small id="resultInfo"></small><div id="takeStatus" role="status"></div><div class="resultActions"><a id="download" download>Download</a><button id="nativeShare">Share / Save</button></div></dialog>
<video id="inputVideo" playsinline webkit-playsinline muted preload="auto" class="input-media" aria-hidden="true" tabindex="-1"></video><script>window.addEventListener('error',function(e){var el=document.getElementById('status');if(el)el.textContent='Startup: '+(e.message||'Failed to load '+(e.target.src||'resource'));},true);</script><script src="./engine.js?v=019" defer></script><script src="./compat.js?v=019" defer></script><script src="./app.js?v=019" defer></script></body></html>
